.cat-item { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 80px; transition: transform 0.3s ease; }
.cat-item:hover { transform: translateY(-5px); }
.cat-item a { text-decoration: none; color: inherit; display: block; }
.cat-img { width: 80px; height: 80px; border-radius: 50%; background-color: var(--bg-light, #f8f8f8); overflow: hidden; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }

.cat-scroll-bar-fill { position: absolute; top: 0; left: 0; width: 20%; height: 100%; background: #333; transition: width 0.1s ease-out; }
