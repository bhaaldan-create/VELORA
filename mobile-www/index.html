<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F8F4F1" />
    <title>VELORA</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(160deg, #f8f4f1 0%, #f1eae6 55%, #e9dfd6 100%);
        color: #1a121c;
        text-align: center;
      }
      .brand {
        letter-spacing: 0.28em;
        font-size: 1.75rem;
        font-weight: 600;
        color: #3d2640;
      }
      .tag {
        margin-top: 0.75rem;
        letter-spacing: 0.18em;
        font-size: 0.7rem;
        color: #8b7a84;
        text-transform: uppercase;
      }
      p {
        margin: 1.5rem auto 0;
        max-width: 22rem;
        line-height: 1.7;
        font-size: 0.95rem;
        color: #5c4a56;
      }
      code {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.35rem 0.6rem;
        background: rgba(61, 38, 64, 0.06);
        font-size: 0.8rem;
        direction: ltr;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">VELORA</div>
      <div class="tag">Beauty Revealed</div>
      <p>
        عيّني رابط المتجر في
        <code>VELORA_MOBILE_URL</code>
        ثم شغّلي
        <code>npm run mobile:sync</code>
        لفتح التطبيق على Android أو iOS.
      </p>
    </main>
  </body>
</html>
